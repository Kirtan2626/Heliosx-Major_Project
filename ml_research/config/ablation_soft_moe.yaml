# Ablation: soft Mixture-of-Experts head (STRETCH architecture)
# Implementation plan, Sections 11.6 and 11.8 (row 5 of the five-way table).
#
# Shared trunk + N expert sub-heads + soft gate over the regime vector.
# End-to-end trained with the same Double-DQN loss.

experiment:
  name: "helios_x_v2_soft_moe"
  seed: 42
  device: "cpu"

architecture:
  type: soft_moe
  module: agent.moe_head
  class: SoftMoEQNetwork
  base_state_dim: 14
  n_regimes: 11
  n_experts: 4
  trunk_hidden: [128, 128]
  expert_hidden: [64]
  gate_hidden: [32]
  gate_temperature: 1.0

state:
  base_dim: 14
  regime_dim: 11
  total_dim: 25

actions:
  dim: 13

training:
  algorithm: "Double DQN"
  optimizer: Adam
  learning_rate: 0.0003
  gamma: 0.95
  tau: 0.005
  batch_size: 64
  replay_buffer_size: 50000
  min_replay_size: 1000
  max_grad_norm: 1.0
  loss: smooth_l1
  load_balance_loss_coef: 0.01     # encourages all experts to be used

exploration:
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_steps: 30000

budget:
  episodes_per_city: 1000
  total_episodes: 11000
  checkpoint_every: 100
  eval_every: 200

warmstart:
  enabled: true
  pretrain_epochs: 80
  pretrain_lr: 0.001
  include_regime_input: true

cities_config: config/cities_extended.yaml

regime_classifier:
  centroids_path: deployment/regime_centroids.npz
  n_bootstrap: 500

evaluation:
  protocols: [in_distribution, loco, unseen_coordinate]
  baselines: [fixed_tilt, deterministic, pure_physics, dqn_baseline]
  statistical_test: wilcoxon_signed_rank
  significance_level: 0.05

seeds: [42, 123, 7, 2024, 9]

diagnostics:
  log_expert_weights: true         # for the gating-distribution figure
  log_per_regime_expert_usage: true
